# https://taskfile.dev
version: '3'

vars:
  ALL: ./...
  DIST: ./dist
  CMD_ROOT: ./cmd
  IMAGE: barnowlsnest/stratus
  IMAGE_CLI: barnowlsnest/stratuscli
  TAG: '{{.TAG | default "latest"}}'

tasks:
  buf-build:
    desc: Build buf
    cmds:
      - buf dep update
      - buf build

  buf-gen:
    desc: Generate gRPC code from proto
    cmds:
      - buf generate

  go-build-app:
    deps:
      - sanity
    cmds:
      - rm -rf '{{.DIST}}/app'
      - mkdir -p '{{.DIST}}/app'
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o '{{.DIST}}/app' '{{.CMD_ROOT}}/app/stratus.go'

  go-build-cli:
    deps:
      - sanity
    cmds:
      - rm -rf '{{.DIST}}/cli'
      - mkdir -p '{{.DIST}}/cli'
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o '{{.DIST}}/cli' '{{.CMD_ROOT}}/cli/stratuscli.go'

  go-fmt:
    cmds:
      - go fmt '{{.ALL}}'

  go-vet:
    cmds:
      - go vet '{{.ALL}}'

  go-test:
    cmds:
      # -race is cgo-only, so it must survive a CGO_ENABLED=0 environment.
      - CGO_ENABLED=1 go test -race -cover '{{.ALL}}'

  go-lint:
    cmds:
      - golangci-lint run --fix

  sanity:
    cmds:
      - task: go-fmt
      - task: go-vet
      - task: go-lint
      - task: go-test

  clear:
    cmds:
      - rm -rf '{{.DIST}}'

  docker-build:
    deps:
      - sanity
    cmds:
      - docker build -f app.Dockerfile -t {{.IMAGE}}:{{.TAG}} .

  docker-build-cli:
    deps:
      - sanity
    cmds:
      - docker build -f cli.Dockerfile -t {{.IMAGE_CLI}}:{{.TAG}} .

  docker-run-cli:
    desc: Run the CLI in a container. Everything after `--` is passed to stratuscli,
      e.g. `task docker-run-cli -- info` or `task docker-run-cli -- --tui`
    deps:
      - docker-build-cli
    cmds:
      - docker run --rm -it --network host {{.IMAGE_CLI}}:{{.TAG}} {{.CLI_ARGS}}

  docker-push:
    deps:
      - docker-build
    cmds:
      - docker push {{.IMAGE}}:{{.TAG}}

  docker-run:
    deps:
      - docker-build
    cmds:
      - docker compose up
